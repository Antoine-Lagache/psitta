# Static analysis configuration for the project.
# Goal: catch architectural and logical errors early,
# without polluting development with UI micro-optimizations.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Allow TODOs without warning spam (intentional design notes)
    flutter_style_todos: ignore

linter:
  rules:
    # ===== Core code quality (important) =====

    # Enforce explicit return types (especially for domain logic)
    always_declare_return_types: true

    # Prefer immutability for fields (crucial for models / SRS state)
    prefer_final_fields: true

    # Catch forgotten async calls (very common source of bugs)
    unawaited_futures: true

    # Prevent silent exception swallowing
    avoid_catches_without_on_clauses: true

    # Avoid debug prints leaking into production logic
    avoid_print: true

    # 80 char is NOT ENOUGH 
    lines_longer_than_80_chars: false


    # ===== Flutter / UI rules deliberately relaxed =====

    # Const-related rules bring noise, not architectural value
    prefer_const_constructors: false
    prefer_const_literals_to_create_immutables: false
    prefer_const_constructors_in_immutables: false

    # Widget boilerplate rule — not relevant for early-stage UI
    use_key_in_widget_constructors: false

    # ===== Style / comfort =====

    # Let Dart formatter handle style; avoid lint noise
    prefer_single_quotes: false
