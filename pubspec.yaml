name: psitta
description: "A modular Flutter language learning app powered by a custom SRS engine."
publish_to: 'none'

version: 0.1.0+2
homepage: https://github.com/Antoine-Lagache/psitta
repository: https://github.com/Antoine-Lagache/psitta
issue_tracker: https://github.com/Antoine-Lagache/psitta/issues

environment:
  sdk: ^3.9.0

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_soloud: ^3.5.4
  flutter_widget_from_html: ^0.17.2
  html: ^0.15.6
  path_provider: ^2.1.6
  sqlite3_flutter_libs: ^0.6.0+eol
  sqlite_async: ^0.14.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  test: ^1.31.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Medium.otf
          weight: 500
        - asset: assets/fonts/NotoSansJP-Bold.otf
          weight: 700
  assets:
    - assets/database/
    - assets/legal/
    - assets/content/v0_1/manifest.json
    - assets/content/v0_1/word_exercises.jsonl.gz
    - assets/content/v0_1/sentence_exercises.jsonl.gz
