name: Prepare release draft

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build applications run ID from main
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate build and checks
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const runId = Number(context.payload.inputs.build_run_id);
            if (!Number.isSafeInteger(runId) || runId <= 0) throw new Error('Invalid build run ID');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId});
            if (run.head_branch !== 'main' || run.path !== '.github/workflows/build_apps.yml' || run.conclusion !== 'success') {
              throw new Error('Select a successful Build applications run from main');
            }
            const {data: checks} = await github.rest.actions.listWorkflowRunsForRepo({...context.repo, head_sha: run.head_sha, per_page: 100});
            if (!checks.workflow_runs.some(r => r.path === '.github/workflows/flutter_tests.yml' && r.conclusion === 'success')) {
              throw new Error('Flutter checks must succeed for the exact build commit');
            }
            core.setOutput('sha', run.head_sha);
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          pattern: Psitta-*
          path: downloaded
      - name: Verify provenance, checksums and Android signing
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python tools/prepare_release_assets.py
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          version=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' pubspec.yaml)
          gh release create "v$version" dist/release/* --draft --target "$SOURCE_SHA" --title "Psitta $version" --notes-file docs/releases/release_notes_v0.1.0.md
