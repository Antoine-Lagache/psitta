name: Build applications

on:
  workflow_dispatch:
  push:
    branches: [main, chatGPT/develop]
    paths:
      - '.github/workflows/build_apps.yml'
      - 'tools/prepare_native_platform.py'
      - 'tools/package_build.py'
      - 'packaging/windows/**'
      - 'packaging/linux/**'
      - 'tools/package_linux.py'
      - 'android/app/build.gradle.kts'
      - 'tools/configure_android_signing.py'

permissions:
  contents: read

concurrency:
  group: app-builds-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-24.04
          - target: linux
            os: ubuntu-24.04
          - target: windows
            os: windows-2022
          - target: macos
            os: macos-15
          - target: ios
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libasound2-dev libstdc++-12-dev desktop-file-utils
      - name: Prepare native project
        run: |
          python -m pip install Pillow==11.3.0
          python tools/prepare_native_platform.py ${{ matrix.target }}
      - name: Install locked packages
        run: flutter pub get --enforce-lockfile
      - name: Generate initial database
        run: flutter test tools/build_bundled_database.dart --reporter expanded
      - name: Configure Android release signing when available
        if: matrix.target == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python tools/configure_android_signing.py
      - name: Compile
        run: |
          case '${{ matrix.target }}' in
            android) flutter build apk --release ;;
            linux) flutter build linux --release ;;
            windows) flutter build windows --release ;;
            macos) flutter build macos --release --config-only
                   xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Release -derivedDataPath build/apple CODE_SIGNING_ALLOWED=NO ;;
            ios) flutter build ios --release --no-codesign ;;
          esac
      - name: Package application and build information
        run: python tools/package_build.py ${{ matrix.target }}
      - name: Verify Ubuntu package
        if: matrix.target == 'linux'
        run: |
          sudo apt-get install -y ./dist/psitta_*_amd64.deb
          test -x /opt/psitta/psitta
          test -f /opt/psitta/data/flutter_assets/AssetManifest.bin
          test -f /usr/share/icons/hicolor/256x256/apps/net.psitta.app.png
          desktop-file-validate /usr/share/applications/net.psitta.app.desktop
          ldd /opt/psitta/psitta > /tmp/psitta-ldd.txt
          cat /tmp/psitta-ldd.txt
          if grep -q 'not found' /tmp/psitta-ldd.txt; then exit 1; fi
          sudo apt-get remove -y psitta
          test ! -e /opt/psitta/psitta
          test ! -e /usr/share/applications/net.psitta.app.desktop
      - name: Verify Windows installer
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'Psitta-install-check'
          $result = Start-Process $installer.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDir`"") -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer failed: $($result.ExitCode)" }
          foreach ($file in @('psitta.exe', 'flutter_windows.dll', 'data/flutter_assets/AssetManifest.bin')) {
            if (!(Test-Path (Join-Path $installDir $file))) { throw "Missing installed file: $file" }
          }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Psitta.lnk'
          if (!(Test-Path $shortcut)) { throw 'Start menu shortcut missing' }
          $result = Start-Process (Join-Path $installDir 'unins000.exe') -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw 'Uninstaller failed' }
          if (Test-Path (Join-Path $installDir 'psitta.exe')) { throw 'Executable remains after uninstall' }
          if (Test-Path $shortcut) { throw 'Shortcut remains after uninstall' }
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Psitta-${{ matrix.target }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove Android signing material
        if: always() && matrix.target == 'android'
        run: rm -f android/key.properties android/release-keystore.jks
      - name: Preserve generated native project
        if: always() && (matrix.target == 'windows' || matrix.target == 'macos' || matrix.target == 'ios')
        uses: actions/upload-artifact@v4
        with:
          name: native-project-${{ matrix.target }}
          path: |
            ${{ matrix.target }}/
            !${{ matrix.target }}/**/ephemeral/**
            !${{ matrix.target }}/Pods/**
            !${{ matrix.target }}/**/.symlinks/**
          retention-days: 30
